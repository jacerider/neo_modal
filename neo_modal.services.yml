services:
  neo_modal.settings:
    parent: neo_settings.repository
    arguments: ['neo_modal']

  neo_modal.neo_build_event_subscriber:
    class: '\Drupal\neo_modal\EventSubscriber\NeoBuildEventSubscriber'
    tags:
      - { name: 'event_subscriber' }

  neo_modal.twig_extension:
    class: Drupal\neo_modal\TwigExtension
    tags:
      - { name: twig.extension }

  neo_modal.core_loader:
    class: Drupal\neo_modal\ModalCoreLoader
    arguments:
      - '@library.dependency_resolver'
      - '@asset.resolver'
      - '@asset.js.collection_renderer'
      - '@request_stack'
      - '@config.factory'
      - '@state'
      - '@?neo_build.manifest_resolver'
