# The stub: what every page that can open a modal attaches. It carries the
# styles, the Drupal.neoModal API and the core dialog replacement, and fetches
# `modal.core` when a visitor shows intent to open a modal. See src/js/modal.ts.
modal:
  version: VERSION
  neo: true
  css:
    component:
      src/css/modal.css: { minified: true }
  js:
    src/js/modal.ts: {}
  dependencies:
    - core/drupal
    - core/drupalSettings
    - core/once
    # Deliberately NOT core/jquery: the chunk's only jQuery use sits behind
    # `if (typeof jQuery < "u")`, so it is optional by design. Declaring it
    # would force jQuery onto every page that opens a dialog.
    - neo/animate

# The modal code proper. Never attach it at render time: the stub loads it on
# demand, and neo_modal_library_info_alter() makes `modal` depend on it where
# the `neo_modal_preload` setting asks for it up front. Keep it JS-only: the
# stub injects scripts, not stylesheets.
modal.core:
  version: VERSION
  neo: true
  js:
    src/js/modal-core.ts: {}
  dependencies:
    - neo/library.popper
    - neo/library.body-scroll-lock
    - neo_tooltip/library.tippy

modal-ajax:
  version: VERSION
  neo: true
  js:
    src/js/modal-ajax.ts: {}
  dependencies:
    - core/drupal
    - core/drupal.ajax
    - neo_modal/modal

links:
  version: VERSION
  neo: true
  js:
    src/js/modal-link.ts: {}
  dependencies:
    - core/drupal.ajax

modal-dialog-ajax:
  version: VERSION
  neo: true
  js:
    src/js/modal-dialog-ajax.ts: {}
  dependencies:
    # Not core/drupal.dialog.ajax: neo_modal_library_info_alter() makes that
    # library depend on this one, so declaring it back is a cycle.
    - core/drupal
